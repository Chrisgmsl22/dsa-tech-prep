<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ground">
  <main class="wrap">
    <header class="masthead">
      <div class="brand">
        <span class="brand__name">Prep</span>
        <span class="brand__sub">/ AlgoMap · <span id="catalogSize">129</span></span>
      </div>
      <nav class="views" id="tabs" aria-label="Views">
        <button class="tab" data-view="due" aria-current="page">Today <span class="tab__badge" id="dueBadge">0</span></button>
        <button class="tab" data-view="new">New</button>
        <button class="tab" data-view="all">All</button>
        <button class="tab" data-view="sprint">Sprint <span class="tab__badge" id="sprintBadge">0</span></button>
        <button class="tab" data-view="help">How it works</button>
      </nav>
    </header>

    <section class="intro" id="intro"></section>

    <section class="stats" id="stats" aria-label="Progress"></section>

    <nav class="filter" id="filter" aria-label="Categories"></nav>

    <div id="list" class="list"></div>

    <footer class="foot">
      <span class="foot__note" role="status" aria-live="polite">Saved to progress.json — commit to sync</span>
      <div class="foot__actions">
        <button id="exportBtn" class="foot__btn">Export</button>
        <button id="resetBtn" class="foot__btn foot__btn--danger">Reset all</button>
      </div>
    </footer>
  </main>

  <script src="selection.js"></script>
  <script src="sprint.js"></script>
  <script src="app.js"></script>
</body>
</html>
